<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
  :root {
    --ink: #1B2230; --ink2: #3D4656; --muted: #5B6475; --line: #E8ECF2;
    --ground: #F7F9FC; --accent: #3D63DD; --green: #1C7F53;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  main { width: 100%; max-width: 680px; padding: 32px 20px 56px; display: flex; flex-direction: column; align-items: center; gap: 34px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  form.search {
    width: 100%; max-width: 640px; height: 56px; background: #fff; border-radius: 28px;
    box-shadow: 0 1px 2px rgba(27,34,48,.06), 0 10px 30px rgba(27,34,48,.07);
    display: flex; align-items: center; gap: 12px; padding: 0 22px; border: 1.5px solid transparent;
  }
  form.search:focus-within { border-color: var(--accent); }
  form.search { position: relative; }
  .sugg { position: absolute; left: 0; right: 0; top: 62px; background: #fff; border-radius: 18px; padding: 6px; z-index: 5;
    box-shadow: 0 1px 2px rgba(27,34,48,.06), 0 14px 34px rgba(27,34,48,.13); border: 1px solid #E3E7EE; }
  .sugg[hidden] { display: none; }
  .sugg div { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; border-radius: 11px; cursor: pointer; font-size: 15px; }
  .sugg div:hover, .sugg div.sel { background: #EAF0FF; }
  .sugg div b { font-weight: 600; }
  .sugg div span.t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sugg div span.h { color: #7A8394; font-size: 13px; }
  form.search input {
    flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink);
    -webkit-user-select: text; user-select: text;
  }
  form.search input::placeholder { color: #7A8394; }
  .seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; background: #E3E8EF; border-radius: 12px; margin-top: -14px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; height: 32px; padding: 0 16px; font: inherit; font-size: 13px;
    font-weight: 500; color: var(--ink2); display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .seg button:hover { background: rgba(255,255,255,.55); }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(27,34,48,.08); }
  .seg .dot { width: 8px; height: 8px; border-radius: 4px; }
  .empty { width: 100%; max-width: 640px; text-align: center; color: var(--muted); font-size: 13px; margin-top: -14px; }
  .grid { width: 100%; max-width: 640px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 18px 12px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: var(--ink2); font-size: 12px; font-weight: 500; border-radius: 16px; padding: 6px 4px; }
  .tile .ic {
    width: 64px; height: 64px; border-radius: 20px; background: #fff;
    box-shadow: 0 1px 2px rgba(27,34,48,.06), 0 6px 16px rgba(27,34,48,.05);
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tile:hover .ic { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(27,34,48,.07), 0 10px 22px rgba(27,34,48,.08); }
  .tile:active .ic { transform: scale(.92); background: #E9EDF3; box-shadow: 0 1px 2px rgba(27,34,48,.08); transition-duration: .05s; }
  .tile.opening .ic { background: #E9EDF3; transform: scale(.96); box-shadow: none; }
  .tile.opening .ic span { opacity: .35; }
  .tile.opening .ic::after {
    content: ""; position: absolute; width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(61,99,221,.22); border-top-color: var(--accent); animation: spin .7s linear infinite;
  }
  .tile.opening .name { color: var(--accent); }
  .tile .ic { position: relative; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tile .name { max-width: 92px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .rm {
    position: absolute; top: 0; right: 6px; width: 22px; height: 22px; border-radius: 11px; border: 0;
    background: #fff; color: var(--muted); box-shadow: 0 1px 4px rgba(27,34,48,.15); cursor: pointer;
    display: none; align-items: center; justify-content: center; padding: 0;
  }
  .tile:hover .rm { display: flex; }
  .tile.add .ic { background: transparent; box-shadow: none; border: 1.5px dashed #B8C0CC; color: var(--muted); width: 62px; height: 62px; }
  .tile.add { cursor: pointer; background: none; border: 0; font: inherit; font-size: 12px; font-weight: 500; color: var(--ink2); }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: #fff; border: 1px solid var(--line); border-radius: 14px; font-size: 12.5px; color: var(--ink2); }
  /* обои новой вкладки */
  body.wp { background: var(--ground) center / cover no-repeat fixed; }
  body.wp .brand h1 { text-shadow: 0 1px 12px rgba(255,255,255,.9); }
  body.wp .seg { background: rgba(255,255,255,.55); backdrop-filter: blur(8px); }
  body.wp .tile .name { background: rgba(255,255,255,.78); padding: 2px 7px; border-radius: 8px; }
  body.wp .empty { background: rgba(255,255,255,.7); border-radius: 10px; padding: 6px 10px; }
  body.wp .chip { background: rgba(255,255,255,.85); border-color: transparent; backdrop-filter: blur(6px); }
  body.wp .tile.add .ic { background: rgba(255,255,255,.6); }
  dialog { border: 1px solid var(--line); border-radius: 18px; padding: 22px; width: 380px; box-shadow: 0 20px 50px rgba(27,34,48,.18); color: var(--ink); }
  dialog::backdrop { background: rgba(27,34,48,.25); }
  dialog h2 { margin: 0 0 14px; font-size: 17px; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
  dialog input { width: 100%; height: 38px; border-radius: 10px; border: 1.5px solid transparent; background: #F1F4F8; padding: 0 12px; font: inherit; font-size: 14px; outline: 0; -webkit-user-select: text; user-select: text; }
  dialog input:focus { border-color: var(--accent); background: #fff; }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn { height: 38px; padding: 0 16px; border-radius: 12px; border: 1px solid #D7DDE6; background: #fff; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg width="46" height="46" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="30" fill="#3D63DD"/><g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"><path d="M28 48 q8 -8 16 0 t16 0 t16 0 t16 0"/><path d="M36 64 q8 -8 16 0 t16 0 t16 0" opacity=".8"/><path d="M44 80 q8 -8 16 0 t16 0" opacity=".6"/></g></svg>
    <h1>Дымка</h1>
  </div>

  <form class="search" id="search" autocomplete="off">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6475" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" aria-label="Поиск" placeholder="Искать в DuckDuckGo или ввести адрес" role="combobox" autocomplete="off">
    <div class="sugg" id="sugg" hidden></div>
  </form>

  <div class="seg" id="seg" role="tablist" aria-label="Контейнер"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>

  <div class="stats">
    <div class="chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C7F53" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span id="blocked">Сегодня заблокировано 0 трекеров</span></div>
    <div class="chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D4656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span id="sleeping">Спящих вкладок нет</span></div>
    <div class="chip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D4656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span id="cookies">Cookie удаляются при закрытии</span></div>
  </div>
</main>

<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h2>Добавить сайт</h2>
    <label for="addUrl">Адрес</label>
    <input id="addUrl" placeholder="например, kad.arbitr.ru" required>
    <label for="addTitle">Название (необязательно)</label>
    <input id="addTitle" placeholder="Картотека">
    <div class="row">
      <button class="btn" value="cancel" type="button" id="addCancel">Отмена</button>
      <button class="btn primary" value="ok" type="submit">Добавить</button>
    </div>
  </form>
</dialog>

<script>
  try { const w0 = localStorage.getItem('dymka-wp'); if (w0) { document.body.classList.add('wp'); document.body.style.backgroundImage = 'url("' + encodeURI(w0) + '")'; } } catch (e) {}
  const wv = window.chrome && window.chrome.webview;
  const send = (m) => { if (wv) wv.postMessage(m); };

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  function render(d) {
    if (d.wallpaper) {
      document.body.classList.add('wp');
      document.body.style.backgroundImage = 'url("' + encodeURI(d.wallpaper) + '")';
      try { localStorage.setItem('dymka-wp', d.wallpaper); } catch (e) {}
    } else {
      document.body.classList.remove('wp');
      document.body.style.backgroundImage = '';
      try { localStorage.removeItem('dymka-wp'); } catch (e) {}
    }
    const seg = document.getElementById('seg');
    seg.textContent = '';
    for (const c of (d.containers || [])) {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.dataset.container = c.id;
      b.setAttribute('aria-selected', c.id === d.container ? 'true' : 'false');
      if (c.id === d.container) b.className = 'on';
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = c.color;
      const nm = document.createElement('span'); nm.textContent = c.name;
      b.append(dot, nm);
      b.addEventListener('click', () => { if (c.id !== d.container) send({ type: 'container', id: c.id }); });
      seg.append(b);
    }
    const empty = document.getElementById('empty');
    empty.hidden = d.shortcuts.length > 0;
    empty.textContent = 'В контейнере «' + d.containerName + '» пока нет сайтов. Нажмите «Добавить» или выберите «Добавить на стартовую страницу» в меню адресной строки.';
    const grid = document.getElementById('grid');
    grid.textContent = '';
    for (const s of d.shortcuts) {
      const a = document.createElement('a');
      a.className = 'tile'; a.href = s.url; a.title = s.url;
      const ic = document.createElement('span'); ic.className = 'ic'; ic.style.color = s.fg;
      const letter = document.createElement('span'); letter.textContent = s.letter; ic.append(letter);
      a.addEventListener('click', (e) => {
        if (e.ctrlKey || e.shiftKey || e.metaKey || e.button !== 0) return;
        document.querySelectorAll('.tile.opening').forEach(t => t.classList.remove('opening'));
        a.classList.add('opening');
      });
      const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = s.title;
      const rm = document.createElement('button'); rm.className = 'rm'; rm.type = 'button'; rm.title = 'Убрать';
      rm.setAttribute('aria-label', 'Убрать ' + s.title);
      rm.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      rm.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); send({ type: 'remove', url: s.url }); });
      a.append(ic, nm, rm);
      grid.append(a);
    }
    const add = document.createElement('button');
    add.className = 'tile add'; add.type = 'button';
    add.innerHTML = '<span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="name">Добавить</span>';
    add.addEventListener('click', () => { document.getElementById('addUrl').value = ''; document.getElementById('addTitle').value = ''; document.getElementById('addDlg').showModal(); });
    grid.append(add);

    const n = d.blocked;
    document.getElementById('blocked').textContent =
      'Сегодня ' + plural(n, 'заблокирован ', 'заблокировано ', 'заблокировано ') + n.toLocaleString('ru-RU') + ' ' + plural(n, 'трекер', 'трекера', 'трекеров');
    const s = d.sleeping;
    document.getElementById('sleeping').textContent = s === 0 ? 'Спящих вкладок нет'
      : s + ' ' + plural(s, 'вкладка спит', 'вкладки спят', 'вкладок спят') + ' и не занимают память';
    document.getElementById('cookies').textContent = d.clearOnExit ? 'Cookie удаляются при закрытии' : 'Cookie сохраняются после закрытия';
    document.getElementById('q').placeholder = 'Искать в ' + d.engine + ' или ввести адрес';
  }

  if (wv) {
    wv.addEventListener('message', (e) => { if (e.data && e.data.type === 'data') render(e.data); });
    send({ type: 'init' });
  }

  // подсказки при вводе: переход на сайт (из плиток, вкладок, сохранённых паролей, известных сайтов) и поисковые подсказки
  const qEl = document.getElementById('q'), sugg = document.getElementById('sugg');
  let items = [], sel = -1, timer = 0;
  const GLOBE = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3D63DD" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>';
  const LENS = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7A8394" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function hideSugg() { sugg.hidden = true; items = []; sel = -1; }
  function drawSugg() {
    if (!items.length) { hideSugg(); return; }
    sugg.innerHTML = items.map((s, i) => '<div data-i="' + i + '" class="' + (i === sel ? 'sel' : '') + '">' +
      (s.kind === 'nav' ? GLOBE + '<span class="t"><b>Перейти: ' + esc(s.text) + '</b></span><span class="h">' + esc(s.hint) + '</span>'
                        : LENS + '<span class="t">' + esc(s.text) + '</span>') + '</div>').join('');
    sugg.hidden = false;
  }
  function choose(i) {
    const s = items[i];
    if (!s) return;
    hideSugg();
    send({ type: 'go', q: s.kind === 'nav' ? s.url : s.text });
  }
  qEl.addEventListener('input', () => {
    clearTimeout(timer);
    const q = qEl.value.trim();
    if (q.length < 2) { hideSugg(); return; }
    timer = setTimeout(() => send({ type: 'suggest', q: qEl.value }), 120);
  });
  qEl.addEventListener('keydown', (e) => {
    if (sugg.hidden) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = items.length + 1;
      sel = ((sel + 1 + (e.key === 'ArrowDown' ? 1 : -1)) % n + n) % n - 1;
      drawSugg();
    } else if (e.key === 'Escape') { hideSugg(); }
    else if (e.key === 'Enter' && sel >= 0) { e.preventDefault(); choose(sel); }
  });
  qEl.addEventListener('blur', () => setTimeout(hideSugg, 180));
  sugg.addEventListener('mousedown', (e) => { const d = e.target.closest('div[data-i]'); if (d) { e.preventDefault(); choose(+d.dataset.i); } });
  if (wv) wv.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'suggest' && e.data.q === qEl.value && document.activeElement === qEl) { items = e.data.items || []; sel = -1; drawSugg(); }
  });

  document.getElementById('search').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = qEl.value.trim();
    hideSugg();
    if (q) send({ type: 'go', q });
  });

  document.getElementById('addCancel').addEventListener('click', () => document.getElementById('addDlg').close());
  document.getElementById('addForm').addEventListener('submit', () => {
    const url = document.getElementById('addUrl').value.trim();
    const title = document.getElementById('addTitle').value.trim();
    if (url) send({ type: 'add', url, title });
  });

  window.addEventListener('pageshow', () => document.querySelectorAll('.tile.opening').forEach(t => t.classList.remove('opening')));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) send({ type: 'init' }); });
</script>
</body>
</html>
