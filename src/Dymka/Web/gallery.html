<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея фонов</title>
<style>
  :root { --ink: #1B2230; --ink2: #3D4656; --muted: #5B6475; --line: #E8ECF2; --ground: #F7F9FC; --accent: #3D63DD; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  header { max-width: 1180px; margin: 0 auto; padding: 36px 24px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 640px; }
  .btn { height: 38px; padding: 0 16px; border-radius: 12px; border: 1px solid #D7DDE6; background: #fff; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: #B8C2D0; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  h2 { max-width: 1180px; margin: 22px auto 10px; padding: 0 24px; font-size: 15px; font-weight: 600; color: var(--ink2); }
  .grid { max-width: 1180px; margin: 0 auto; padding: 0 24px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card { background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #E3E7EE; box-shadow: 0 1px 2px rgba(27,34,48,.04); display: flex; flex-direction: column; }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(61,99,221,.25); }
  .card .img { aspect-ratio: 16 / 9; background: #EEF1F5 center / cover no-repeat; position: relative; }
  .card .tag { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,.9); border-radius: 9px; padding: 3px 9px; font-size: 11.5px; color: var(--ink2); }
  .card .body { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .card .title { flex: 1; font-size: 13.5px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .card .state { font-size: 12px; color: var(--muted); }
  .card .del { width: 30px; height: 30px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
  .card .del:hover { background: #F1F4F8; color: #B3261E; }
  .chips { max-width: 1180px; margin: 14px auto 0; padding: 0 24px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { height: 32px; padding: 0 14px; border-radius: 16px; border: 1px solid #D7DDE6; background: #fff; font: inherit; font-size: 13px; color: var(--ink2); cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips .sep { width: 1px; height: 22px; align-self: center; background: #D7DDE6; margin: 0 4px; }
  .card .img { cursor: zoom-in; }
  .card .img:hover::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.08); }
  /* предпросмотр */
  #pv { position: fixed; inset: 0; z-index: 10; background: rgba(14,18,28,.84); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px 96px; }
  #pv[hidden] { display: none; }
  #pv .frame { position: relative; width: min(100%, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #2A3040 center / cover no-repeat; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  #pv .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
  #pv .frame img.ready { opacity: 1; }
  #pv .bar { width: min(100%, calc((100vh - 150px) * 16 / 9)); display: flex; align-items: center; gap: 12px; color: #fff; }
  #pv .bar .t { flex: 1; min-width: 0; }
  #pv .bar .t b { display: block; font-size: 16px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #pv .bar .t span { font-size: 12.5px; color: rgba(255,255,255,.7); }
  #pv .bar .st { font-size: 13px; color: rgba(255,255,255,.8); }
  #pv .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer;
             background: rgba(255,255,255,.9); color: var(--ink); opacity: .35; transition: opacity .15s, transform .15s; display: flex; align-items: center; justify-content: center; }
  #pv .nav:hover { opacity: 1; }
  #pv .nav:disabled { visibility: hidden; }
  #pv .nav.prev { left: 22px; } #pv .nav.next { right: 22px; }
  #pv .close { position: absolute; top: 16px; right: 18px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; opacity: .7; }
  #pv .close:hover { opacity: 1; background: rgba(255,255,255,.24); }
  .msg { max-width: 1180px; margin: 30px auto; padding: 0 24px; color: var(--muted); font-size: 14px; }

  @media (prefers-color-scheme: dark) {
    :root { --ink: #E6EAF0; --ink2: #C2C9D4; --muted: #97A1B2; --line: #2D333D; --ground: #16191F; --accent: #5B7FF0; color-scheme: dark; }
    .btn, .chips button, .card { background: #1E222A; color: var(--ink); border-color: #363D48; }
    .btn:hover { border-color: #4A5260; }
    .btn.primary, .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .card { box-shadow: none; }
    .card .img { background-color: #272C35; }
    .card .tag { background: rgba(30,34,42,.9); color: var(--ink2); }
    .card .del:hover { background: #272C35; color: #FF6A5C; }
    .chips .sep { background: #363D48; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Галерея фонов</h1>
    <p>Фоны для новой вкладки. Нажмите «Поставить» - фон скачается в папку «Дымки» и сразу появится на новой вкладке. Скачанные фоны переключаются стрелками в меню новой вкладки (шестерёнка внизу справа).</p>
  </div>
  <button class="btn" id="upload" type="button">Загрузить свой фон</button>
</header>
<div class="chips" id="chips"></div>
<div class="msg" id="msg">Загружаю каталог…</div>
<h2 id="hCatalog" hidden>Фоны «Дымки»</h2>
<div class="grid" id="catalog"></div>
<h2 id="hCustom" hidden>Свои фоны</h2>
<div class="grid" id="custom"></div>
<div id="pv" hidden role="dialog" aria-label="Предпросмотр фона">
  <button class="close" type="button" title="Закрыть (Esc)" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="nav prev" type="button" title="Предыдущий (←)" aria-label="Предыдущий"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="frame"><img alt=""></div>
  <div class="bar"><div class="t"><b></b><span></span></div><span class="st"></span><button class="btn primary" type="button">Поставить</button></div>
  <button class="nav next" type="button" title="Следующий (→)" aria-label="Следующий"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<script>
  const wv = window.chrome && window.chrome.webview;
  const send = (m) => { if (wv) wv.postMessage(m); };
  const themes = { winter: 'Зима', spring: 'Весна', summer: 'Лето', autumn: 'Осень', newyear: 'Новый год', march8: '8 Марта' };
  let current = '';
  function card(it, removable, list, index) {
    const c = document.createElement('div');
    c.className = 'card' + (it.local === current ? ' current' : '');
    c.dataset.local = it.local;
    c.dataset.tags = (it.tags || []).join(' ');
    const img = document.createElement('div'); img.className = 'img'; img.style.backgroundImage = 'url("' + it.thumb + '")';
    img.title = 'Открыть крупнее';
    img.addEventListener('click', () => openPreview(list, index));
    if (it.theme && themes[it.theme]) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = themes[it.theme]; img.append(t); }
    const body = document.createElement('div'); body.className = 'body';
    const title = document.createElement('span'); title.className = 'title'; title.textContent = it.title || it.file;
    body.append(title);
    if (it.local === current) {
      const st = document.createElement('span'); st.className = 'state'; st.textContent = 'Сейчас на новой вкладке'; body.append(st);
    } else {
      const b = document.createElement('button'); b.className = 'btn primary'; b.type = 'button';
      b.textContent = 'Поставить';
      b.addEventListener('click', () => { b.disabled = true; b.textContent = it.installed ? 'Ставлю…' : 'Скачиваю…'; send({ type: 'gallery-use', file: it.file, local: it.local }); });
      body.append(b);
    }
    if (removable && it.installed) {
      const d = document.createElement('button'); d.className = 'del'; d.type = 'button'; d.title = 'Удалить с компьютера'; d.setAttribute('aria-label', 'Удалить');
      d.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
      d.addEventListener('click', () => send({ type: 'gallery-delete', local: it.local }));
      body.append(d);
    }
    c.append(img, body);
    return c;
  }
  let data = null, filter = 'all';
  // Фильтры: времена года и праздники (по имени файла) и подборки из каталога («Азия», «Пейзажи»…).
  // Подборка хранится как 'tag:имя', чтобы не совпасть с темой.
  function matches(it) {
    if (filter === 'all') return true;
    if (filter.startsWith('tag:')) return (it.tags || []).includes(filter.slice(4));
    return (it.theme || '') === filter;
  }
  function drawChips() {
    const box = document.getElementById('chips'); box.textContent = '';
    const present = new Set(data.items.map(i => i.theme || ''));
    const list = [['all', 'Все'], ['', 'Круглый год']].concat(Object.entries(themes)).filter(([k]) => k === 'all' || present.has(k));
    const usedTags = new Set(data.items.flatMap(i => i.tags || []));
    const tagList = Object.entries(data.tagNames || {}).filter(([k]) => usedTags.has(k)).map(([k, label]) => ['tag:' + k, label]);
    if (filter !== 'all' && ![...list, ...tagList].some(([k]) => k === filter)) filter = 'all';
    const add = ([k, label]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.dataset.filter = k;
      if (k === filter) b.className = 'on';
      b.addEventListener('click', () => { filter = k; draw(); });
      box.append(b);
    };
    list.forEach(add);
    if (tagList.length) { const s = document.createElement('span'); s.className = 'sep'; box.append(s); tagList.forEach(add); }
  }
  function draw() {
    if (!data) return;
    drawChips();
    const cat = document.getElementById('catalog'), cus = document.getElementById('custom');
    cat.textContent = ''; cus.textContent = '';
    const shown = data.items.filter(matches);
    shown.forEach((it, i) => cat.append(card(it, !it.local.startsWith('dymka-'), shown, i)));
    data.custom.forEach((it, i) => cus.append(card(it, true, data.custom, i)));
    if (pv.list) refreshPreview();
    document.getElementById('hCatalog').hidden = data.items.length === 0;
    document.getElementById('hCustom').hidden = data.custom.length === 0;
    document.getElementById('msg').hidden = true;
  }
  // ---- предпросмотр: крупный фон, стрелки, «Поставить»
  const pv = { el: document.getElementById('pv'), list: null, i: 0, setting: '' };
  const pvImg = pv.el.querySelector('.frame img'), pvFrame = pv.el.querySelector('.frame');
  const pvSet = pv.el.querySelector('.bar .btn'), pvSt = pv.el.querySelector('.bar .st');
  function openPreview(list, i) { pv.kind = list === data.custom ? 'custom' : 'items'; pv.list = list; pv.i = i; pv.el.hidden = false; showPreview(); }
  function closePreview() { pv.el.hidden = true; pv.list = null; pvImg.removeAttribute('src'); }
  function showPreview() {
    const it = pv.list[pv.i];
    pvFrame.style.backgroundImage = 'url("' + it.thumb + '")';   // сразу миниатюра, потом - полный размер
    pvImg.classList.remove('ready');
    const full = it.full || it.thumb;
    pvImg.onload = () => { if (pv.list && pv.list[pv.i] === it) pvImg.classList.add('ready'); };
    pvImg.src = full;
    pv.el.querySelector('.bar b').textContent = it.title || it.file;
    const labels = [];
    if (it.theme && themes[it.theme]) labels.push(themes[it.theme]);
    for (const t of it.tags || []) if (data.tagNames && data.tagNames[t]) labels.push(data.tagNames[t]);
    pv.el.querySelector('.bar .t span').textContent = (pv.i + 1) + ' из ' + pv.list.length + (labels.length ? ' · ' + labels.join(', ') : '');
    pv.el.querySelector('.nav.prev').disabled = pv.i === 0;
    pv.el.querySelector('.nav.next').disabled = pv.i === pv.list.length - 1;
    const isCur = it.local === current;
    pvSt.textContent = isCur ? 'Сейчас на новой вкладке' : '';
    pvSet.hidden = isCur;
    pvSet.disabled = pv.setting === it.local;
    pvSet.textContent = pv.setting === it.local ? (it.installed ? 'Ставлю…' : 'Скачиваю…') : 'Поставить';
  }
  function refreshPreview() {
    // каталог обновился (поставили или удалили фон): тот же фон в новом списке
    const local = pv.list[pv.i] && pv.list[pv.i].local;
    const list = pv.kind === 'custom' ? data.custom : data.items.filter(matches);
    const i = list.findIndex(x => x.local === local);
    if (i < 0) { closePreview(); return; }
    pv.list = list; pv.i = i; showPreview();
  }
  function step(d) { if (!pv.list) return; const j = pv.i + d; if (j < 0 || j >= pv.list.length) return; pv.i = j; showPreview(); }
  pv.el.querySelector('.nav.prev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
  pv.el.querySelector('.nav.next').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
  pv.el.querySelector('.close').addEventListener('click', closePreview);
  pv.el.addEventListener('click', (e) => { if (e.target === pv.el) closePreview(); });
  pvSet.addEventListener('click', () => {
    const it = pv.list[pv.i]; pv.setting = it.local; showPreview();
    send({ type: 'gallery-use', file: it.file, local: it.local });
  });
  document.addEventListener('keydown', (e) => {
    if (!pv.list) return;
    if (e.key === 'Escape') closePreview();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else return;
    e.preventDefault();
  });

  if (wv) wv.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'gallery') { data = m; current = m.current || ''; pv.setting = ''; draw(); }
    else if (m.type === 'gallery-done' || m.type === 'gallery-deleted' || m.type === 'gallery-reload') send({ type: 'gallery-init' });
    else if (m.type === 'gallery-error') {
      const msg = document.getElementById('msg'); msg.hidden = false;
      msg.textContent = 'Не удалось связаться с галереей (' + m.message + '). Проверьте подключение к интернету и обновите страницу (F5).';
      document.querySelectorAll('.btn.primary:disabled').forEach(b => { b.disabled = false; b.textContent = 'Поставить'; });
      if (pv.list) { pv.setting = ''; showPreview(); }
    }
  });
  document.getElementById('upload').addEventListener('click', () => send({ type: 'gallery-upload' }));
  send({ type: 'gallery-init' });
</script>
</body>
</html>
