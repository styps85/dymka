name: nuget-cache
# Служебное: выгрузка пакетов NuGet для проверочной сборки (ручной запуск)
on:
  workflow_dispatch:
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore src/Dymka/Dymka.csproj -p:EnableWindowsTargeting=true && dotnet restore tests/Dymka.Tests
      - run: tar czf nuget.tgz -C ~/.nuget packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nuget.tgz
          retention-days: 3
