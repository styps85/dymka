name: Скачать сертификаты Минцифры (разово)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать Sub CA 2024 из разных источников
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p certs && cd certs
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          # ссылки со страницы Госуслуг (если они есть в HTML)
          curl -sL -A "$ua" --max-time 40 https://www.gosuslugi.ru/crt -o gosuslugi.html || true
          grep -oE 'https?://[^"'"'"' ]+\.(cer|crt)' gosuslugi.html | sort -u > links.txt || true
          cat >> links.txt <<'EOF'
          https://gu-st.ru/content/lending/russian_trusted_sub_ca_2024_pem.crt
          https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca_2024.cer
          https://www.sberbank.ru/certificates/russian_trusted_sub_ca_2024.cer
          http://rostelecom.ru/cdp/subca_ssl_rsa2024.crt
          http://company.rt.ru/cdp/subca_ssl_rsa2024.crt
          http://reestr-pki.ru/cdp/subca_ssl_rsa2024.crt
          EOF
          i=0
          while read -r u; do
            [ -z "$u" ] && continue
            i=$((i+1))
            if curl -sfL -A "$ua" --max-time 40 "$u" -o "dl$i.bin"; then echo "OK $u"; echo "dl$i.bin $u" >> sources.txt; else echo "FAIL $u"; rm -f "dl$i.bin"; fi
          done < links.txt
          # цепочки с сайтов, работающих на сертификатах Минцифры
          for h in www.sberbank.ru online.sberbank.ru www.gosuslugi.ru www.nalog.gov.ru www.vtb.ru kad.arbitr.ru; do
            timeout 30 openssl s_client -connect "$h:443" -servername "$h" -showcerts </dev/null 2>/dev/null \
              | awk -v p="chain-$h-" '/BEGIN CERT/{n++; f=p n ".pem"} f{print > f} /END CERT/{f=""}' || true
          done
          cd ..
      - name: Отобрать и проверить
        shell: bash
        run: |
          set +e +o pipefail
          cd certs
          root=../src/Dymka/Bundled/russian_trusted_root_ca.crt
          : > report.txt
          for f in dl*.bin chain-*.pem; do
            [ -f "$f" ] || continue
            pem="$f.pem"
            openssl x509 -in "$f" -out "$pem" 2>/dev/null || openssl x509 -inform der -in "$f" -out "$pem" 2>/dev/null || { echo "$f | не сертификат" >> report.txt; continue; }
            subj=$(openssl x509 -in "$pem" -noout -subject -nameopt RFC2253)
            iss=$(openssl x509 -in "$pem" -noout -issuer -nameopt RFC2253)
            dates=$(openssl x509 -in "$pem" -noout -startdate -enddate | tr '\n' ' ')
            fp=$(openssl x509 -in "$pem" -noout -fingerprint -sha256)
            ver=$(openssl verify -CAfile "$root" "$pem" 2>&1 | tail -1)
            src=$(grep "^$f " sources.txt 2>/dev/null | cut -d' ' -f2-)
            echo "$f | $src | $subj | $iss | $dates | $fp | $ver" >> report.txt
          done
          cat report.txt
          while read -r l; do echo "::notice::$l"; done < report.txt
      - name: Опубликовать
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          zip -r certs.zip certs
          gh release delete certs-fetch --yes --cleanup-tag --repo ${{ github.repository }} 2>/dev/null || true
          gh release create certs-fetch certs.zip --repo ${{ github.repository }} --prerelease --latest=false --target ${{ github.sha }} --title "Сертификаты (служебное)" --notes "Разовая выгрузка"
