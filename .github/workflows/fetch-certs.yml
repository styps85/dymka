name: Скачать сертификаты Минцифры (разово)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: windows-latest
    steps:
      - name: Скачать из двух источников и сравнить
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certs | Out-Null
          $src = @{
            "gu-root.crt"   = "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt";
            "gu-sub.crt"    = "https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt";
            "gu-root.cer"   = "https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer";
            "gu-sub.cer"    = "https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer";
            "sber-root.cer" = "https://www.sberbank.com/common/img/uploaded/files/pdf/russian_trusted_root_ca.cer";
            "sber-sub.cer"  = "https://www.sberbank.com/common/img/uploaded/files/pdf/russian_trusted_sub_ca.cer";
            "sbr-root.cer"  = "https://www.sberbank.ru/certificates/russian_trusted_root_ca.cer";
            "sbr-sub.cer"   = "https://www.sberbank.ru/certificates/russian_trusted_sub_ca.cer";
          }
          foreach ($k in $src.Keys) {
            try { Invoke-WebRequest -Uri $src[$k] -OutFile "certs/$k" -TimeoutSec 40 -UserAgent "Mozilla/5.0"; Write-Host "OK $k" } catch { Write-Host "FAIL $k $($_.Exception.Message)" }
          }
          $report = @()
          foreach ($f in Get-ChildItem certs) {
            try {
              $c = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($f.FullName)
              $sha = [BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash($c.RawData)).Replace("-","")
              $report += "$($f.Name) | $($c.Subject) | issuer: $($c.Issuer) | $($c.NotBefore.ToString('yyyy-MM-dd')) - $($c.NotAfter.ToString('yyyy-MM-dd')) | SHA256 $sha"
            } catch { $report += "$($f.Name) | не разобран: $($_.Exception.Message)" }
          }
          $report | Out-File certs/report.txt -Encoding utf8
          $report | ForEach-Object { Write-Host "::notice::$_" }
      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path certs/* -DestinationPath certs.zip -Force
          gh release delete certs-fetch --yes --cleanup-tag 2>$null
          gh release create certs-fetch certs.zip --prerelease --latest=false --target ${{ github.sha }} --title "Сертификаты (служебное)" --notes "Разовая выгрузка"
